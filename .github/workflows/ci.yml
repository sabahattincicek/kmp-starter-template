# Builds the Android and web apps, runs the unit tests, and runs Android lint on every push and pull
# request. The same commands make up the "Definition of done" in AGENTS.md.
#
# The iOS job needs a macOS runner. On a public repository it runs on every push and pull request;
# on a private repository it runs only when started by hand (Actions > CI > Run workflow), because
# macOS minutes use up the private minute quota much faster. See docsagent/SETUP.md.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-web:
    name: Android and Web
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android and Web
        run: ./gradlew :androidApp:assembleDebug :webApp:wasmJsBrowserDistribution

      - name: Unit tests (Android host and browser)
        run: ./gradlew allTests

      - name: Lint
        run: ./gradlew lint

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-android-web
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  ios:
    name: iOS
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (iOS simulator)
        run: ./gradlew iosSimulatorArm64Test

      - name: Build iOS app
        working-directory: iosApp
        # Only arm64: the template has no Intel (x86_64) simulator target.
        run: >
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-ios
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
